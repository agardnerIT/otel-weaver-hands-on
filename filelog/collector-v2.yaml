# v2: parses the line into OTEL + ACME attributes.
receivers:
  filelog:
    include: [/logs/app.log]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<sev>\w+) HTTP (?P<method>\w+) (?P<status>\d+) .+? (?P<path>/\S*) (?P<client>\S+) cost\.code=(?P<cost_code>\S+)$'
        severity:
          parse_from: attributes.sev
      - type: remove
        field: attributes.sev
      - type: move
        from: attributes.method
        to: attributes["http.request.method"]
      # semconv requires an int, regex captures are strings
      - type: add
        field: attributes["http.response.status_code"]
        value: EXPR(int(attributes.status))
      - type: remove
        field: attributes.status
      - type: move
        from: attributes.path
        to: attributes["url.path"]
      - type: move
        from: attributes.client
        to: attributes["client.address"]
      - type: move
        from: attributes.cost_code
        to: attributes["acme.cost.code"]

processors:
  resource:
    attributes:
      - key: service.name
        value: acme-web
        action: upsert

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: host.docker.internal:4317
    compression: none  # Weaver does not accept gzip
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource]
      exporters: [debug, otlp]
