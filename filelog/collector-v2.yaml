# v2: parses the line into OTEL + ACME attributes.
receivers:
  filelog:
    include: [/logs/app.log]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<sev>\w+) HTTP (?P<method>\w+) (?P<status>\d+) .+? (?P<path>/\S*) (?P<client>\S+) cost\.code=(?P<cost_code>\S+)$'
        severity:
          parse_from: attributes.sev
      - type: remove
        field: attributes.sev
      - type: move
        from: attributes.method
        to: attributes["http.request.method"]
      - type: move
        from: attributes.status
        to: attributes["http.response.status_code"]
      - type: move
        from: attributes.path
        to: attributes["url.path"]
      - type: move
        from: attributes.client
        to: attributes["client.address"]
      # Promoted to the Resource by the transform processor below
      - type: move
        from: attributes.cost_code
        to: attributes["acme.cost.code"]

processors:
  resource:
    attributes:
      - key: service.name
        value: acme-web
        action: upsert
  transform:
    log_statements:
      - set(resource.attributes["acme.cost.code"], log.attributes["acme.cost.code"])
      - delete_key(log.attributes, "acme.cost.code")
      # http.response.status_code must be an int per semconv
      - set(log.attributes["http.response.status_code"], Int(log.attributes["http.response.status_code"]))

exporters:
  otlp:
    endpoint: host.docker.internal:4317
    compression: none  # Weaver does not accept gzip
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, transform]
      exporters: [otlp]
